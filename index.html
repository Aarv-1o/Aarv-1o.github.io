<style>
img{max-width:100%}[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: skewed "menu screen" — content panel left, tilted section menu right (stacks on phones).
   Single light look: paper white, signal blue, racing red, navy ink. */
:root{
  --paper:#ffffff;--wash:#eef3ff;--tint:#dce6ff;
  --ink:#0b1a3d;--soft:#3d4b6b;--muted:#6f84bd;
  --blue:#1d4ed8;--red:#e11d2e;--onred:#ffffff;
  --stripe:rgba(29,78,216,.05);
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Manrope","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--wash)}
body{margin:0;min-height:100vh;color:var(--ink);font:400 18px/1.6 var(--body);background:var(--paper);background:radial-gradient(120% 90% at 15% 0%,var(--paper) 0%,var(--paper) 45%,var(--wash) 100%) fixed}
.art{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.art .slab{position:absolute;right:-12vw;top:-15vh;width:50vw;height:140vh;background:linear-gradient(180deg,var(--wash),var(--tint));transform:skewX(-14deg);opacity:.75}
.art .slash{position:absolute;right:36vw;top:-15vh;width:12px;height:140vh;background:var(--red);transform:skewX(-14deg);opacity:.9}
.art .slash.s2{right:calc(36vw - 30px);width:5px;background:var(--blue)}
.art .dots{position:absolute;left:-60px;bottom:-60px;width:460px;height:460px;background:radial-gradient(var(--blue) 2px,transparent 2.6px) 0 0/16px 16px;-webkit-mask:radial-gradient(circle at 0 100%,#000 0,transparent 70%);mask:radial-gradient(circle at 0 100%,#000 0,transparent 70%);opacity:.3}
.art .dots.d2{left:auto;bottom:auto;right:-60px;top:-60px;width:360px;height:360px;background-image:radial-gradient(var(--red) 2px,transparent 2.6px);-webkit-mask:radial-gradient(circle at 100% 0,#000 0,transparent 70%);mask:radial-gradient(circle at 100% 0,#000 0,transparent 70%);opacity:.25}
.art b{position:absolute;right:1vw;bottom:-3vw;font:900 italic 20vw/.8 var(--display);letter-spacing:-.05em;color:transparent;-webkit-text-stroke:2px var(--tint)}
@media (max-width:820px){.art .slab{width:80vw;right:-40vw}.art .slash{display:none}.art b{font-size:38vw}}
body::after{content:"";position:fixed;inset:0;background:repeating-linear-gradient(115deg,var(--stripe) 0 2px,transparent 2px 46px);pointer-events:none;z-index:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
a{color:inherit}
.app{position:relative;z-index:1;overflow-x:clip;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,34%);min-height:100vh}
.main{grid-column:1;grid-row:1;padding-block:28px 48px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:32px;min-width:0}

.view{animation:in .3s ease-out}
@keyframes in{from{opacity:.001;transform:translateX(-28px)}to{opacity:1;transform:none}}
.eyebrow{font:500 13px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin:0 0 14px}

/* Home */
.hero{--px:clamp(340px,28vw,470px);--pw:clamp(240px,21vw,320px);position:relative;display:flex;align-items:center;min-height:max(calc(100vh - 120px),calc(var(--pw) * 1.5 + 60px))}
.hero-text{position:relative;display:flex;flex-direction:column;align-items:flex-start;min-width:0;width:100%;min-height:calc(var(--pw) * 1.5 + 40px)}
.hero-text > :not(.shot){position:relative;z-index:2}
.hero-text .lead{max-width:calc(var(--px) - 28px)}
.hero-text .ticker{max-width:30em}
.roles{display:flex;flex-wrap:wrap;gap:10px 12px;margin:0 0 26px;padding:0 0 0 4px;list-style:none}
.roles li{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:8px 14px;border:1.5px solid var(--blue);color:var(--blue);background:var(--paper);transform:skewX(-8deg);white-space:nowrap}
.roles li span{display:block;transform:skewX(8deg)}
.name{position:relative;z-index:2;font:900 italic clamp(56px,7vw,124px)/.9 var(--display);letter-spacing:-.035em;margin:0;color:var(--ink);-webkit-text-stroke:10px var(--paper);paint-order:stroke fill;text-shadow:6px 6px 0 var(--tint);white-space:nowrap}
.name span{color:var(--red)}
.shot{position:absolute;z-index:1;left:var(--px);top:24px;width:var(--pw);margin:0}
.shot::before{content:"";position:absolute;left:0;right:0;bottom:0;top:22%;background:var(--blue);clip-path:polygon(14% 0,100% 0,86% 100%,0 100%)}
.shot::after{content:"";position:absolute;right:-26px;top:38%;width:84px;height:16px;background:var(--red);transform:skewX(-20deg)}
.shot img{position:relative;z-index:1;display:block;width:100%;aspect-ratio:2/3;object-fit:cover;object-position:50% 0;clip-path:polygon(0 0,100% 0,100% 22%,86% 100%,0 100%);max-width:100%}
.lead{font-size:19px;max-width:30em;margin:30px 0 0;color:var(--soft);text-wrap:pretty}
.lead b{color:var(--ink);font-weight:700}
.ctas{display:flex;flex-wrap:wrap;gap:16px;margin-top:34px}
.btn{display:inline-flex;align-items:center;padding:10px 22px;border:2px solid var(--ink);transform:skewX(-8deg);text-decoration:none;font:800 italic 19px/1.2 var(--display);cursor:pointer;transition:transform .15s}
.btn > span{transform:skewX(8deg)}
.btn.p{background:var(--red);color:var(--onred);border-color:var(--red);box-shadow:5px 5px 0 var(--blue)}
.btn.s{background:var(--paper);color:var(--ink);box-shadow:5px 5px 0 var(--red)}
.btn:hover{transform:skewX(-8deg) translateX(6px)}
.ticker{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:36px;padding-top:18px;border-top:1px solid var(--tint);align-self:stretch;max-width:30em;font:500 13px/1.4 var(--mono);color:var(--soft);letter-spacing:.06em;text-transform:uppercase}
.ticker span::before{content:"▸ ";color:var(--red)}

/* Section headings */
h2,.pt{font:900 italic clamp(30px,3.6vw,44px)/1.05 var(--display);letter-spacing:-.02em;margin:0 0 8px;text-shadow:3px 3px 0 var(--tint);text-wrap:balance}
.intro{color:var(--soft);margin:0 0 26px;max-width:34em}

/* Project cards: skewed slab, upright content */
.stack{display:grid;gap:26px;max-width:720px}
.proj{background:var(--paper);color:var(--ink);border:2px solid var(--ink);box-shadow:8px 8px 0 var(--blue);transform:skewX(-4deg);margin-left:10px}
.proj .in{transform:skewX(4deg);padding:20px 26px 22px;display:grid;gap:12px}
.proj header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.proj header > div{flex:1;min-width:0}
.proj .ct{margin:0;font:900 italic 30px/1.05 var(--display);letter-spacing:-.02em}
.proj .sub{margin:2px 0 0;font-size:16px;color:var(--soft)}
.mark{width:52px;height:52px;flex:none;display:grid;place-items:center;background:var(--c);color:var(--paper);font:900 italic 24px/1 var(--display);clip-path:polygon(14% 0,100% 0,86% 100%,0 100%)}
.mark img{width:100%;height:100%;object-fit:cover}
.pill{margin-left:auto;font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:7px 10px;background:var(--red);color:var(--onred);white-space:nowrap}
.pill.o{background:transparent;color:var(--blue);box-shadow:inset 0 0 0 1.5px currentColor}
.role{margin:0;font-size:16px}
.role b{font-weight:700;color:var(--blue)}
.proj ul{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:16px;line-height:1.5}
.proj li{display:grid;grid-template-columns:16px 1fr;gap:6px}
.proj li::before{content:"";width:8px;height:8px;margin-top:8px;background:var(--red);transform:skewX(-12deg)}
.spec{font:500 12px/1.5 var(--mono);letter-spacing:.03em;color:var(--blue);border-top:1px dashed var(--muted);padding-top:10px;display:flex;flex-wrap:wrap;gap:4px 14px}
.go{justify-self:start;font:800 italic 17px/1.2 var(--display);text-decoration:none;color:var(--ink);border-bottom:3px solid var(--red)}
.go:hover{background:var(--red);color:var(--onred)}

/* About */
.bio{margin-top:18px}
.bio .motto{font:900 italic clamp(26px,3vw,36px)/1.1 var(--display);letter-spacing:-.02em;color:var(--ink);margin:26px 0 6px;text-shadow:3px 3px 0 var(--tint)}
.motto span{color:var(--red)}
.bio b{color:var(--ink);font-weight:700}
.bio p{max-width:33em;color:var(--soft);font-size:19px;margin:0 0 16px}
.facts{display:grid;gap:12px;max-width:620px;margin-top:22px}
.fact{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;background:var(--paper);color:var(--ink);padding:12px 22px;border:2px solid var(--ink);border-left:8px solid var(--red);transform:skewX(-8deg);box-shadow:4px 4px 0 var(--tint)}
.fact > *{transform:skewX(8deg)}
.fact span{font:500 12px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.fact b{font:800 italic 21px/1.2 var(--display);text-align:right}

/* Contact */
.mailrow{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.big{font:900 italic clamp(24px,3.4vw,44px)/1.1 var(--display);letter-spacing:-.02em;color:var(--ink);text-decoration:none;border-bottom:5px solid var(--red);text-shadow:3px 3px 0 var(--tint);overflow-wrap:anywhere}
.big:hover{color:var(--blue)}
.mailbtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
a.copy{text-decoration:none}
.copy.alt{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.copy:hover{transform:translateY(-2px)}
.copy{display:inline-flex;align-items:center;min-height:44px;font:500 13px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;background:var(--blue);color:var(--paper);border:0;padding:0 18px;cursor:pointer}
.links{display:flex;gap:16px;margin-top:30px;flex-wrap:wrap}

.skip{position:absolute;left:-9999px;top:8px;z-index:10;background:var(--ink);color:var(--paper);padding:12px 16px;font:600 14px var(--body)}
.skip:focus{left:max(16px,env(safe-area-inset-left,0px))}
.main:focus{outline:none}
.siteid{align-self:flex-start;font:900 italic 20px/1 var(--display);letter-spacing:-.02em;color:var(--ink);text-decoration:none;padding:10px 0 6px;border-bottom:3px solid var(--red)}
.siteid:hover{color:var(--blue)}
.main[data-view="home"] .siteid{display:none}
.foot{margin-top:auto;font:500 12px/1.5 var(--mono);color:var(--soft);letter-spacing:.04em}

/* Side menu */
.side{grid-column:2;grid-row:1;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;padding-block:24px;padding-left:0;padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
.menu{position:relative;display:flex;flex-direction:column;align-items:flex-end;transform:rotate(-6deg) skewX(-8deg);margin-right:3vw;padding:16px 0}
.menu .tab{position:relative;z-index:2;background:none;border:0;cursor:pointer;color:var(--muted);padding:0 26px;font:900 italic clamp(40px,min(6.6vw,10vh),90px)/1.04 var(--display);letter-spacing:-.03em;text-shadow:3px 3px 0 var(--wash);outline:none;transition:color .1s}
.menu .tab:hover{color:var(--blue)}
.menu .tab[aria-selected="true"]{color:var(--paper);text-shadow:3px 3px 0 var(--ink)}
.menu .tab:focus-visible{text-decoration:underline;text-decoration-thickness:4px}
.sel{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:1;transition:transform .09s,width .09s,height .09s}
.sel b{position:absolute;inset:0;display:block}
.sel .r{background:var(--red);z-index:1}
.sel .c{background:var(--blue);transform:translate(8px,7px);z-index:0}

@media (max-width:1180px){
  .hero{display:grid;min-height:0}
  .hero-text{min-height:0}
  .shot{position:relative;left:auto;top:auto;order:-1;align-self:flex-end;width:min(250px,62vw);margin:0 10px -110px 0}
  .hero-text .lead,.hero-text .ctas,.hero-text .ticker{max-width:30em}
  .name{order:0}
  .roles{order:1;margin:20px 0 0}
  .hero-text .lead{order:2}
  .ctas{order:3}
  .ticker{order:4}
  .name{font-size:clamp(56px,15vw,96px)}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .main,.side{grid-column:1;grid-row:auto}
  .side{position:relative;height:auto;align-items:stretch;padding-block:16px 4px;padding-left:max(16px,env(safe-area-inset-left,0px))}
  .menu{flex-direction:row;flex-wrap:wrap;justify-content:flex-end;align-self:flex-end;transform:rotate(-3deg) skewX(-8deg);margin-right:8px;padding:8px 0}
  .menu .tab{font-size:30px;padding:0 12px}
  .main{padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .proj{margin-left:4px;margin-right:8px}
  .proj .in{padding:18px 18px 20px}
  .proj .ct{font-size:25px}
  .proj header > div{flex-basis:calc(100% - 70px)}
  .pill{margin-left:0}
  .lead{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="art" aria-hidden="true"><i class="slab"></i><i class="slash"></i><i class="slash s2"></i><i class="dots"></i><i class="dots d2"></i><b>BUILD</b></div>
<a class="skip" href="#content">Skip to content</a>
<div class="app">
  <aside class="side">
    <nav class="menu" id="menu" role="tablist" aria-orientation="vertical" aria-label="Sections"><i class="sel" aria-hidden="true"><b class="r"></b><b class="c"></b></i></nav>
  </aside>
  <main class="main" id="content" tabindex="-1">
    <a class="siteid" href="#home" id="siteid">Aarv Singh Chauhan</a>
    <div id="view" role="tabpanel" aria-live="polite"></div>
    <div class="foot" id="foot"></div>
  </main>
</div>

<script>
/* ✏️ EDIT THIS BLOCK: it controls everything on the page. */
const ME = {
  first: "Aarv", middle: "Singh", last: "Chauhan",
  status: "Building GitNomad",
  role: "Co-founder & CTO, Zextiria AI · Co-founder, AgentinFlow",
  intro: "I build AI tools and apps, mostly the parts under the hood. I’ve co-founded two startups, <b>Zextiria AI</b> and <b>AgentinFlow</b>, and shipped <b>GitNomad</b>, an app that lets you code and push from your phone.",
  ticker: ["AI agents", "Design", "SSH & Git"],
  projects: [
    {
      title: "GitNomad", sub: "Manage Git repos from your phone", status: "Shipped", mark: "G", color: "#1d4ed8",
      role: "Built it with a friend",
      points: [
        "Connect to your own computer over SSH, right from your phone",
        "Open, read and edit your repos wherever you are",
        "Commit, push and run terminal commands without opening a laptop"
      ],
      spec: ["SSH", "git commit · push", "Remote terminal"],
      url: "https://play.google.com/store/apps/details?id=dev.gitnomad.app", urlText: "Get it on Google Play"
    }
  ],
  ventures: [
    {
      title: "Zextiria AI", sub: "Your agent. Their agent. One room.", logo: "zextiria.png", status: "In production", role: "Co-founder & CTO",
      points: [
        "Our product, Rooms, puts an agency and its client in one space to work on the same documents",
        "Clients join from a link. No sign-up",
        "Both sides can bring their own AI agent. The agents suggest edits, and people approve them"
      ],
      url: "https://rooms.zextiriaai.com", urlText: "rooms.zextiriaai.com"
    },
    {
      title: "AgentinFlow", sub: "AI automation agency", logo: "agentinflow.png", role: "Co-founder",
      points: ["We build AI agents and automations that take the boring, repetitive work off a business’s plate"],
      url: "https://agentinflow.com", urlText: "agentinflow.com"
    }
  ],
  bio: [
    "I’m a developer from India. I like building things that fix real problems. Some start as a weekend experiment, and a few turn into startups.",
    "I want to know how things work under the hood, so I keep taking on things I haven’t done before. That’s how I get better at both the technical side and the creative side.",
    "So far I’ve co-founded two startups:",
    "<b>Zextiria AI</b>, where I’m the CTO. We build Rooms, a shared space where an agency and its client work on the same documents. Each side can bring its own AI agent, and every change an agent suggests waits for a person to approve it.",
    "<b>AgentinFlow</b>, an AI automation agency. We build AI agents and automations that take the boring, repetitive work off a business’s plate.",
    "On the side, I shipped GitNomad with a friend, and you’ll often find me at a hackathon."
  ],
  facts: [["Based in","India"],["Co-founded","Zextiria AI, AgentinFlow"],["Role","CTO at Zextiria AI"],["Builds","AI agents & dev tools"],["Shipped","GitNomad"]],
  email: "aarvsinghchauhan@gmail.com",
  links: [["LinkedIn","https://www.linkedin.com/in/aarv-singh-chauhan-4a7987291/"],["GitHub","https://github.com/Aarv-1o"]]
};

const $ = id => document.getElementById(id);
const full = ME.first + " " + ME.middle + " " + ME.last;
const GMAIL = "https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=" + ME.email;
$("foot").textContent = "© " + new Date().getFullYear() + " " + full;

const mark = p => p.logo
  ? '<span class="mark"><img src="' + p.logo + '" alt="' + p.title + ' logo"></span>'
  : '<span class="mark" style="--c:' + p.color + '" aria-hidden="true">' + p.mark + '</span>';
const card = p => '<article class="proj"><div class="in"><header>' + mark(p) +
  '<div><h2 class="ct">' + p.title + '</h2><p class="sub">' + p.sub + '</p></div>' +
  (p.status ? '<span class="pill' + (p.outline ? ' o' : '') + '">' + p.status + '</span>' : '') + '</header>' +
  (p.role ? '<p class="role"><b>My part:</b> ' + p.role + '</p>' : '') +
  '<ul>' + p.points.map(t => '<li>' + t + '</li>').join('') + '</ul>' +
  (p.spec ? '<div class="spec">' + p.spec.map(s => '<span>' + s + '</span>').join('<span aria-hidden="true">/</span>') + '</div>' : '') +
  (p.url ? '<a class="go" href="' + p.url + '" target="_blank" rel="noopener">' + p.urlText + ' ↗</a>' : '') +
  '</div></article>';
const linkBtn = l => '<a class="btn s" href="' + l[1] + '" target="_blank" rel="noopener"><span>' + l[0] + ' ↗</span></a>';

/* id, menu label, view */
const VIEWS = [
  ["home","Home", () => '<div class="hero"><div class="hero-text">' +
    '<ul class="roles" aria-label="Roles">' + ME.role.split(" · ").map(r => '<li><span>' + r + '</span></li>').join('') + '</ul>' +
    '<h1 class="name" aria-label="' + full + '">' + ME.first + '<br>' + ME.last + '<span>.</span></h1>' +
    '<p class="lead">' + ME.intro + '</p>' +
    '<div class="ctas"><a class="btn p" href="#work" data-go="work"><span>See my work →</span></a>' + ME.links.map(linkBtn).join('') + '</div>' +
    '<div class="ticker">' + ME.ticker.map(t => '<span>' + t + '</span>').join('') + '</div>' +
    '<figure class="shot"><img src="aarv-2.webp" alt="Portrait of ' + full + '"></figure></div></div>'],
  ["work","Work", () => '<p class="eyebrow">Work</p><h1 class="pt">What I’ve shipped</h1><p class="intro">Built with a friend and live on the Play Store.</p><div class="stack">' + ME.projects.map(card).join('') + '</div>'],
  ["ventures","Ventures", () => '<p class="eyebrow">Ventures</p><h1 class="pt">My startups</h1><p class="intro">Two companies I co-founded.</p><div class="stack">' + ME.ventures.map(card).join('') + '</div>'],
  ["about","About", () => '<p class="eyebrow">About</p><h1 class="pt">A bit about me</h1><div class="bio">' + ME.bio.map(t => '<p>' + t + '</p>').join('') + '<p class="motto">Always learning. <span>Always building.</span></p></div><div class="facts">' +
    ME.facts.map(f => '<div class="fact"><span>' + f[0] + '</span><b>' + f[1] + '</b></div>').join('') + '</div>'],
  ["contact","Contact", () => '<p class="eyebrow">Contact</p><h1 class="pt">Say hi</h1><p class="intro">Got a project, an idea, or need one more person for a hackathon? Send me a mail.</p>' +
    '<div class="mailrow"><a class="big" href="' + GMAIL + '" target="_blank" rel="noopener">' + ME.email + '</a></div>' +
    '<div class="mailbtns"><a class="copy" href="' + GMAIL + '" target="_blank" rel="noopener">Write in Gmail ↗</a><a class="copy alt" href="mailto:' + ME.email + '">Open mail app</a><button class="copy alt" id="copyBtn" type="button">Copy email</button></div><div class="links">' +
    ME.links.map(linkBtn).join('') + '</div>']
];

const menu = $("menu"), sel = menu.querySelector(".sel"), view = $("view");
const tabs = VIEWS.map((v, i) => {
  const b = document.createElement("button");
  b.className = "tab"; b.setAttribute("role","tab"); b.id = "tab-" + v[0]; b.textContent = v[1]; b.setAttribute("aria-controls","view");
  b.onclick = () => choose(i); b.addEventListener("focus", () => choose(i));
  menu.appendChild(b); return b;
});
let cur = -1;
const rnd = (a, b) => (a + Math.random() * (b - a)).toFixed(1);
function jitter(){
  sel.querySelectorAll("b").forEach(b => b.style.clipPath = "polygon(" + rnd(0,10) + "% " + rnd(0,20) + "%," + rnd(90,100) + "% " + rnd(10,35) + "%," + rnd(90,100) + "% " + rnd(70,100) + "%," + rnd(0,10) + "% " + rnd(65,100) + "%)");
}
function place(){
  const a = tabs[cur]; if (!a) return;
  sel.style.width = a.offsetWidth + "px"; sel.style.height = a.offsetHeight + "px";
  sel.style.transform = "translate(" + a.offsetLeft + "px," + a.offsetTop + "px)";
}
function choose(i, keepHash){
  if (i === cur) return;
  cur = i;
  tabs.forEach((t, j) => { t.setAttribute("aria-selected", j === i); t.tabIndex = j === i ? 0 : -1; });
  view.setAttribute("aria-labelledby", tabs[i].id);
  view.innerHTML = '<div class="view">' + VIEWS[i][2]() + "</div>";
  $("content").dataset.view = VIEWS[i][0];
  document.title = (i ? VIEWS[i][1] + " · " : "") + full;
  if (!keepHash) { try { history.replaceState(null, "", "#" + VIEWS[i][0]); } catch(e){} }
  place();
}
view.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go) { e.preventDefault(); choose(VIEWS.findIndex(v => v[0] === go.dataset.go)); scrollTo({top:0, behavior:"smooth"}); return; }
  if (e.target.id === "copyBtn") {
    const btn = e.target, done = t => { btn.textContent = t; setTimeout(() => btn.textContent = "Copy email", 1600); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(view.querySelector(".big")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); done("Selected"); };
    try { navigator.clipboard.writeText(ME.email).then(() => done("Copied"), fallback); } catch(err){ fallback(); }
  }
});
$("siteid").addEventListener("click", e => { e.preventDefault(); choose(0); scrollTo({top:0, behavior:"smooth"}); });
menu.addEventListener("keydown", e => {
  const d = ["ArrowDown","ArrowRight"].includes(e.key) ? 1 : ["ArrowUp","ArrowLeft"].includes(e.key) ? -1 : 0;
  if (!d) return;
  e.preventDefault();
  tabs[Math.max(0, Math.min(tabs.length - 1, cur + d))].focus();
});
addEventListener("resize", place);
jitter();
if (!matchMedia("(prefers-reduced-motion:reduce)").matches) setInterval(jitter, 120);
const fromHash = () => Math.max(0, VIEWS.findIndex(v => v[0] === location.hash.slice(1)));
choose(fromHash(), true);
addEventListener("hashchange", () => { const i = VIEWS.findIndex(v => v[0] === location.hash.slice(1)); if (i > -1) choose(i, true); });
if (document.fonts) document.fonts.ready.then(place);
</script>

</body>
